{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm rounded-4 border-0">
                <div class="card-body p-4">
                    <h3 class="fw-bold mb-4">Создать новую категорию</h3>

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-4">
                            <label for="{{ form.name.id_for_label }}" class="form-label fw-semibold">Название категории</label>
                            {{ form.name }}
                            {% if form.name.errors %}
                                <div class="text-danger small mt-1">{{ form.name.errors }}</div>
                            {% endif %}
                        </div>

                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-primary rounded-pill px-4">Сохранить</button>
                            <a href="{% url 'post_create' %}" class="btn btn-outline-secondary rounded-pill px-4">Назад к посту</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
